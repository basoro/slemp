{% extends "layout.html" %}

{% block content %}

<div class="main-content">
		<div class="container-fluid" style="padding-bottom:54px">
			<div class="pos-box bgw mtb15">
				<div class="position f14 c9 pull-left">
					<a class="plr10 c4" href="/">Beranda</a>/<span class="plr10 c4">Aplikasi</span>
				</div>
				<div class="search pull-right">
					<form target="_self" onsubmit='getSList();return false;'>
						<input type="text" id="SearchValue" class="ser-text pull-left" placeholder="Cari" autocomplete="false" />
						<button type="button" class="ser-sub pull-left" onclick='getSList()'></button>
					</form>
				</div>
			</div>
			<div id="phpSecurityNotice" class="mt10" style="display:none"></div>
			<div class="softbox bgw mtb15">
				<div class="softlist">
					<div class="divtable pd15 relative">

						<table class="table table-hover" width="100%" cellspacing="0" cellpadding="0" border="0">
							<thead>
								<tr>
									<th width="185">Aplikasi</th>
									<th>Keterangan</th>
									<th width="40">Lokasi</th>
									<th width="40">Status</th>
									<th width="64">Beranda</th>
									<th style="text-align: right;" width="170">Aksi</th>
								</tr>
							</thead>
							<tbody id="softList"></tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script type="text/javascript" src="/static/js/jquery.dragsort-0.5.2.min.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/laydate/laydate.js?v={{config.version}}"></script>
<script type="text/javascript" src="/static/app/soft.js?v={{config.version}}&t=20261027"></script>
<script>
getSList();
</script>


{% endblock %}
