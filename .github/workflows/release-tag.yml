name: Release panel version

# Panel membandingkan versinya dengan `name` pada releases/latest dari repo ini
# (lihat class/core/system_api.py: getServerInfo), dan mengunduh
# archive/refs/tags/<versi>.zip. Jadi setiap kenaikan versi di config_api.py
# perlu menghasilkan tag sekaligus release dengan nama yang sama.

on:
  push:
    branches: [master]
    paths:
      - class/core/config_api.py
      - .github/workflows/release-tag.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baca versi dari config_api.py
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oE "__version[[:space:]]*=[[:space:]]*'[0-9]+(\.[0-9]+)*'" class/core/config_api.py \
            | head -n1 | grep -oE "[0-9]+(\.[0-9]+)*")
          if [ -z "${VERSION}" ]; then
            echo "::error::Tidak dapat membaca __version dari class/core/config_api.py"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versi terdeteksi: ${VERSION}"

      - name: Cek apakah tag sudah ada
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} sudah ada, tidak ada yang perlu dibuat."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} belum ada, akan dibuat."
          fi

      - name: Siapkan catatan rilis
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list --sort=-v:refname | head -n1 || true)
          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..HEAD"
          else
            RANGE="HEAD"
          fi
          git log --no-merges --pretty='%h%x09%s' -n 300 "${RANGE}" > "$RUNNER_TEMP/commits.tsv"
          PREV="${PREV}" python3 - "$RUNNER_TEMP/commits.tsv" "$RUNNER_TEMP/notes.md" <<'PY'
          import os
          import re
          import sys

          version = os.environ['VERSION']
          repo = os.environ['REPO']
          prev = os.environ.get('PREV', '').strip()

          rows = []
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.rstrip('\n')
              if not line.strip():
                  continue
              sha, _, subject = line.partition('\t')
              rows.append((sha.strip(), subject.strip()))

          buckets = {'Fitur': [], 'Perbaikan': [], 'Pemeliharaan': [], 'Lainnya': []}
          skipped = 0

          for sha, subject in rows:
              # Judul commit yang tidak informatif (mis. "Update") tidak ditampilkan.
              if subject.lower() in ('update', 'updates', 'wip', '.'):
                  skipped += 1
                  continue

              m = re.match(r'^(feat|fix|perf|refactor|docs|ci|chore|style|test|build)(\([^)]+\))?!?:\s*(.+)$', subject)
              if m:
                  kind, scope, rest = m.group(1), m.group(2) or '', m.group(3).strip()
                  scope = scope.strip('()')
                  text = f"{scope}: {rest}" if scope else rest
                  bucket = {'feat': 'Fitur', 'fix': 'Perbaikan', 'perf': 'Perbaikan'}.get(kind, 'Pemeliharaan')
              else:
                  text = subject
                  bucket = 'Lainnya'
              buckets[bucket].append(f"- {text} ({sha})")

          out = []
          title = f"Rilis panel SLEMP {version}"
          out.append(title)
          out.append('=' * len(title))
          out.append('')

          total = sum(len(v) for v in buckets.values())
          if prev:
              out.append(f"{total} perubahan sejak {prev}")
          else:
              out.append(f"{total} perubahan")
          out.append('')

          for name in ('Fitur', 'Perbaikan', 'Pemeliharaan', 'Lainnya'):
              if not buckets[name]:
                  continue
              out.append(f"{name}:")
              out.extend(buckets[name])
              out.append('')

          if skipped:
              out.append(f"({skipped} commit tanpa judul deskriptif tidak ditampilkan)")
              out.append('')

          if prev:
              out.append(f"Perbandingan: https://github.com/{repo}/compare/{prev}...{version}")
          out.append(f"Unduhan: https://github.com/{repo}/archive/refs/tags/{version}.zip")

          with open(sys.argv[2], 'w', encoding='utf-8') as f:
              f.write('\n'.join(out).rstrip() + '\n')
          PY
          cat "$RUNNER_TEMP/notes.md"

      - name: Buat tag dan release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "SLEMP ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          # --title harus sama dengan versi: panel membacanya sebagai field `name`
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
